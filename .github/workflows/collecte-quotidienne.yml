name: Collecte quotidienne

# statarea ne sert qu'une fenetre glissante d'environ +/-3 jours : un jour non
# collecte est perdu definitivement. Ce job tourne donc tous les jours et
# re-collecte toute la fenetre, ce qui remplit a la fois les scores des matchs
# joues et les matchs qui n'etaient pas encore publies la veille.
on:
  schedule:
    # Toutes les 3 heures. statarea ajoute une partie des matchs quelques
    # heures seulement avant leur coup d'envoi : avec trois passages par jour
    # (7 h d'ecart en mediane, jusqu'a 12 h avec les retards de GitHub), un
    # quart des matchs joues n'avaient jamais ete vus avant le coup d'envoi,
    # donc jamais cotes. Minute decalee : les heures rondes sont les plus
    # congestionnees chez GitHub. Le groupe de concurrence empeche deux
    # collectes simultanees si des creneaux retardes se chevauchent.
    - cron: "25 */3 * * *"
  workflow_dispatch:
    inputs:
      delay:
        description: "Pause en secondes entre deux pages"
        default: "5"

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Restauration de la base en cache
        # La reconstruction complete rejouait toutes les archives a chaque
        # execution : 530 s le 21/10, et la duree mediane d'une execution avait
        # double en trois semaines. La base est donc conservee d'une execution a
        # l'autre, et seuls les nouveaux instantanes sont rejoues.
        #
        # L'empreinte du code fait partie de la cle : si les regles de parsing
        # changent, aucun cache ne correspond et la base est reconstruite de
        # zero. Les archives restent la source de verite.
        uses: actions/cache/restore@v4
        with:
          path: data/statarea.db
          key: base-${{ hashFiles('statarea/**/*.py') }}-${{ github.run_id }}
          restore-keys: |
            base-${{ hashFiles('statarea/**/*.py') }}-

      - name: Mise a jour de la base depuis les archives
        # Incremental : ne rejoue que les instantanes absents de la base. Repasse
        # en reconstruction complete si la base est vide, ou si un instantane
        # plus ancien que ceux deja traites apparait (l'ordre de rejeu changerait
        # les valeurs figees a la premiere observation).
        run: python -m statarea reparse --incremental

      - name: Sauvegarde de la base en cache
        # Sauvegardee ici, avant la collecte : le cache correspond alors
        # exactement a des archives deja commitees. Les instantanes de cette
        # execution seront rejoues, une seule fois, par la suivante.
        uses: actions/cache/save@v4
        with:
          path: data/statarea.db
          key: base-${{ hashFiles('statarea/**/*.py') }}-${{ github.run_id }}

      - name: Collecte de la fenetre disponible
        run: python -m statarea scrape --window 3 --delay "${{ inputs.delay || '5' }}"

      - name: Couverture apres collecte
        run: python -m statarea dates

      - name: Releve des cotes
        # Une requete par match : ~180 appels a 1,5 s, soit environ 5 minutes.
        # Sans les cotes, on ne peut mesurer qu'une justesse, jamais une
        # rentabilite. Un echec ici ne doit pas perdre la collecte des matchs,
        # qui est la seule chose irrecuperable.
        continue-on-error: true
        run: python -m statarea odds --delay 1.5

      - name: Archivage du HTML brut
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/odds
          if git diff --cached --quiet; then
            echo "Aucune nouvelle archive."
            exit 0
          fi
          git commit -m "Collecte du $(date -u +%Y-%m-%d)"
          # Un autre job a pu pousser entre-temps : on rejoue par-dessus.
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Reconstruction du site
        # La liste des matchs a venir est calculee a la date de construction.
        # Sans commit (collecte sans nouveaute), l'hebergeur ne reconstruirait
        # pas et le site afficherait des matchs deja joues. Ce hook force donc
        # une reconstruction quotidienne. Sans le secret, l'etape est ignoree.
        env:
          HOOK: ${{ secrets.DEPLOY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DEPLOY_BUILD_HOOK absent : reconstruction non declenchee."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$HOOK" > /dev/null && echo "Reconstruction declenchee."

      - name: Rapport dans le resume du job
        run: |
          {
            echo '```'
            python -m statarea report --min-fav 5 --min-dog 5
            python -m statarea residual --min 5
            python -m statarea residual --min 5 --baseline market
            python -m statarea value
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
